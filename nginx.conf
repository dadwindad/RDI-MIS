server {
    listen 80;
    server_name localhost;

    location /rdi_mis/ {
        alias /usr/share/nginx/html/;
        index index.html index.htm;
        try_files $uri $uri/ /rdi_mis/index.html;
    }

    # Redirect /rdi_mis to /rdi_mis/
    location = /rdi_mis {
        return 301 /rdi_mis/;
    }

    # Redirect root / to /rdi_mis/
    location = / {
        return 301 /rdi_mis/;
    }

    # Proxy Core Backend API
    location /api/ {
        proxy_pass http://core-backend:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy PMS Backend API
    location /api/pms/ {
        proxy_pass http://pms-backend:3002/api/pms/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy Calendar Backend API
    location /api/activities/ {
        proxy_pass http://calendar-backend:3003/api/activities/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy QA Backend API
    location /api/qa/ {
        proxy_pass http://qa-backend:3005/api/qa/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy Core Storage static files
    location /storage/ {
        proxy_pass http://core-backend:3001/storage/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
